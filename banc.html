<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Banc EVA-Responsive</title>
<style>
@font-face{font-family:EvaNoto;src:url(fonts/NotoSerifCJKjp-Black.otf)}
@font-face{font-family:EvaShippori;src:url(fonts/ShipporiMinchoB1-ExtraBold.ttf)}
body{margin:0;background:#111;color:#ddd;font:13px sans-serif;display:flex;gap:12px;padding:10px}
#view{background:repeating-conic-gradient(#2a2a2a 0 25%,#222 0 50%) 0 0/20px 20px}
#ui{display:flex;flex-direction:column;gap:4px;min-width:280px;max-height:96vh;overflow:auto}
label{display:flex;justify-content:space-between;gap:8px;align-items:center}
input[type=text]{width:180px}
#err{color:#f66;white-space:pre-wrap}
</style></head><body>
<canvas id="view" width="1280" height="720"></canvas>
<div id="ui"><div id="err"></div><button id="restart">Recommencer</button><div id="texts"></div><div id="controls"></div></div>
<script>
// Banc WebGL2 de EVA_Responsive.isf : les 6 champs sont rendus dans des canvas comme les
// Text Render du patch (même police, même taille, même interligne ajouté), l'atlas est
// eva_atlas.png. ?w=&h= taille de sortie, ?t= fige l'horloge, ?<input>=<valeur>.
const q = new URLSearchParams(location.search);
const view = document.getElementById('view');
const OW = +(q.get('w') || 1920), OH = +(q.get('h') || 1080);
const cv = document.createElement('canvas'); cv.width = OW; cv.height = OH;
window.cv = cv;
const gl = cv.getContext('webgl2', {premultipliedAlpha: true, preserveDrawingBuffer: true});
gl.getExtension('EXT_color_buffer_float'); gl.getExtension('OES_texture_float_linear');
const vs = view.getContext('2d');
{ const k = Math.min(1280 / OW, 720 / OH); view.width = OW * k; view.height = OH * k; }
const err = document.getElementById('err');

// Mêmes réglages que build_wire.py (FIELDS).
const FIELDS = [
  {name: 'Titre',      font: '900 {s}px EvaNoto',      w: 3840, h: 2160, scale: 2.0, wrap: 3600, text: 'ANGEL / ATTACK'},
  {name: 'Sous-titre', font: '800 {s}px EvaShippori',     w: 1920, h: 1080, scale: 0.9, wrap: 1800, text: 'NEON GENESIS'},
  {name: 'Kanji',      font: '900 {s}px EvaNoto',      w: 3840, h: 2160, scale: 2.0, wrap: 3600, text: '獏 / 宇宙人'},
  {name: 'Label',      font: '700 {s}px "Yu Gothic"',              w: 1920, h: 1080, scale: 0.9, wrap: 1800, text: 'EPISODE:1'},
  {name: 'Infos',      font: '700 {s}px "Yu Gothic"',              w: 1920, h: 1080, scale: 0.6, wrap: 1700, text: 'CODE 601 / BLOOD TYPE BLUE / TARGET 3RD ANGEL'},
  {name: 'Bandeau',    font: '700 {s}px "Bahnschrift"',            w: 1920, h: 1080, scale: 0.9, wrap: 1800, stretch: 'condensed', text: 'EMERGENCY'},
];
const BASE = 132, EXTRA = 40;   // taille de police Text Render à scale 1, interligne ajouté
for (let k = 0; k < 6; k++) if (q.has('t' + k)) FIELDS[k].text = q.get('t' + k);

const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0,1); }`;
const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
function sh(type, s){ const o = gl.createShader(type); gl.shaderSource(o, s); gl.compileShader(o);
  if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; }
function prog(fs){ const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; }
function target(w, h, float){ const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, float ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA, float ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
  for (const k of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR);
  for (const k of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT); return {t, f, w, h}; }
function imgTex(src){ const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  for (const k of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR);
  for (const k of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE);
  return t; }

// Text Render maison : blanc sur transparent, centré, " / " = retour ligne, retour auto à wrap px.
const txtTex = [];
function renderField(k){
  const F = FIELDS[k], c = F.canvas || (F.canvas = document.createElement('canvas'));
  c.width = F.w; c.height = F.h;
  const x = c.getContext('2d'); x.clearRect(0, 0, F.w, F.h);
  const size = BASE * F.scale;
  x.font = F.font.replace('{s}', size); if (F.stretch) x.fontStretch = F.stretch;
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  const lines = [];
  for (const part of F.text.split(' / ')) {
    let cur = '';
    for (const w of part.split(' ')) { const t = cur ? cur + ' ' + w : w;
      if (x.measureText(t).width > F.wrap && cur) { lines.push(cur); cur = w; } else cur = t; }
    if (part.length) lines.push(cur);
  }
  const pitch = size * 1.12 + EXTRA * F.scale;
  const y0 = F.h / 2 - (lines.length - 1) * pitch / 2;
  lines.forEach((l, i) => x.fillText(l, F.w / 2, y0 + i * pitch));
  if (txtTex[k]) gl.deleteTexture(txtTex[k]);
  txtTex[k] = imgTex(c);
}

let P, meta, inputs, passes, tgt = {}, values = {}, atlasTex, t0 = performance.now() / 1000;
async function load(){
  if (q.has('wait')) { window.load = load; window.isfError = 'waiting'; q.delete('wait'); return; }
  const tc0 = performance.now();
  const s = await (await fetch('EVA_Responsive.isf?' + Date.now())).text();
  const end = s.indexOf('}*/'); meta = JSON.parse(s.slice(s.indexOf('/*') + 2, end + 1));
  inputs = meta.INPUTS; passes = meta.PASSES;
  let head = `#version 300 es
precision highp float; precision highp int;
uniform vec2 RENDERSIZE; uniform float TIME; uniform int PASSINDEX;
out vec4 isf_out;
#define gl_FragColor isf_out
#define IMG_NORM_PIXEL(t, uv) textureLod(t, uv, 0.0)
#define IMG_SIZE(t) vec2(textureSize(t, 0))
`;
  for (const ps of passes) if (ps.TARGET) head += `uniform sampler2D ${ps.TARGET};\n`;
  for (const i of inputs) head += `uniform ${i.TYPE === 'image' ? 'sampler2D' : 'float'} ${i.NAME};\n`;
  const hl = head.split('\n').length - 1, off = s.slice(0, end + 3).split('\n').length - 1;
  try { P = prog(head + s.slice(end + 3)); }
  catch (e) { err.textContent = String(e.message).replace(/0:(\d+)/g, (m, l) => 'ligne ' + (l - hl + off)); window.isfError = err.textContent; return; }
  window.isfError = '';
  window.compileMs = performance.now() - tc0;
  const ev = e => Math.max(1, Function('return ' + e.replace(/\$WIDTH/g, OW).replace(/\$HEIGHT/g, OH).replace(/floor/g, 'Math.floor'))());
  for (const ps of passes) if (ps.TARGET) { const w = ps.WIDTH ? ev(ps.WIDTH) : OW, h = ps.HEIGHT ? ev(ps.HEIGHT) : OH;
    tgt[ps.TARGET] = ps.PERSISTENT ? {a: target(w, h, true), b: target(w, h, true), pers: true} : {a: target(w, h, !!ps.FLOAT)}; }
  await document.fonts.load('900 100px EvaNoto', '獏'); await document.fonts.load('800 100px EvaShippori', 'A');
  for (let k = 0; k < 6; k++) renderField(k);
  const img = new Image(); img.src = 'eva_atlas.png'; await img.decode(); atlasTex = imgTex(img);
  // UI
  const tb = document.getElementById('texts');
  FIELDS.forEach((F, k) => { const l = document.createElement('label'); l.textContent = F.name;
    const i = document.createElement('input'); i.type = 'text'; i.value = F.text;
    i.oninput = () => { F.text = i.value; renderField(k); }; l.append(i); tb.append(l); });
  const box = document.getElementById('controls');
  for (const i of inputs) { if (i.TYPE === 'image' || /^(len\d|tSec|tBeat)$/.test(i.NAME)) continue;
    values[i.NAME] = q.has(i.NAME) ? +q.get(i.NAME) : i.DEFAULT;
    const lab = document.createElement('label'); lab.textContent = i.LABEL; let inp;
    if (i.TYPE === 'long') { inp = document.createElement('select');
      i.VALUES.forEach((v, n) => { const o = document.createElement('option'); o.value = v; o.textContent = i.LABELS[n]; inp.append(o); });
      inp.value = values[i.NAME]; inp.onchange = () => values[i.NAME] = +inp.value; }
    else { inp = document.createElement('input'); inp.type = 'range'; inp.min = i.MIN; inp.max = i.MAX; inp.step = (i.MAX - i.MIN) / 200;
      inp.value = values[i.NAME]; inp.oninput = () => values[i.NAME] = +inp.value; }
    lab.append(inp); box.append(lab); }
  document.getElementById('restart').onclick = () => { t0 = performance.now() / 1000; };
  window.values = values; window.FIELDS = FIELDS; window.renderField = renderField;
  if (!q.has('t')) requestAnimationFrame(loop); else draw(+q.get('t'));
}
function loop(){ draw(performance.now() / 1000 - t0); requestAnimationFrame(loop); }
// draw(t): one frame at t seconds since "Recommencer" (call it in steps to play a sequence).
function draw(t){
  gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.useProgram(P);
  const U = n => gl.getUniformLocation(P, n);
  gl.uniform1f(U('TIME'), t); gl.uniform1f(U('tSec'), t); gl.uniform1f(U('tBeat'), t * 2.0);
  FIELDS.forEach((F, k) => gl.uniform1f(U('len' + k), F.text.length));
  for (const n in values) gl.uniform1f(U(n), values[n]);
  for (let pass = 0; pass < passes.length; pass++) {
    const name = passes[pass].TARGET, T = name && tgt[name], tg = T ? (T.pers ? T.b : T.a) : null;
    const binds = FIELDS.map((F, k) => ['txt' + k, txtTex[k]]).concat([['atlas', atlasTex]])
      .concat(Object.entries(tgt).map(([n, x]) => [n, x.a.t]));
    binds.forEach(([n, tx], k) => { gl.activeTexture(gl.TEXTURE0 + k); gl.bindTexture(gl.TEXTURE_2D, (tg && tx === tg.t) ? null : tx); gl.uniform1i(U(n), k); });
    gl.uniform1i(U('PASSINDEX'), pass);
    gl.bindFramebuffer(gl.FRAMEBUFFER, tg ? tg.f : null);
    gl.viewport(0, 0, tg ? tg.w : OW, tg ? tg.h : OH);
    gl.uniform2f(U('RENDERSIZE'), tg ? tg.w : OW, tg ? tg.h : OH);
    if (!tg) { gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT); }
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    if (T && T.pers) [T.a, T.b] = [T.b, T.a];
  }
  vs.clearRect(0, 0, view.width, view.height); vs.drawImage(cv, 0, 0, view.width, view.height);
}
// play(from, to, fps): steps the clock (state pass needs consecutive frames), then shows "to".
window.play = (from, to, fps = 30) => { for (let t = from; t <= to + 1e-6; t += 1 / fps) draw(t); return 'ok'; };
window.draw = draw;
load();
</script></body></html>
